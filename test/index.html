<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>invsbl.vip</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

    <audio id="music" loop></audio>

  <header class="navbar">
    <div class="logo">invsbl.vip</div>
    <nav>
        <a href="#">Products</a>
        <a href="#">Status</a>
        <a href="#">Discord</a>
    </nav>
    <div class="nav-right">
      <button class="dashboard-btn">Dashboard</button>
    </div>
  </header>

  <main class="main-content">
    <div class="category-bar">
      <h2 id="category-title">Valorant</h2>
      <select id="categorySelect" onchange="showCategory(this.value)">
        <option value="valorant">Valorant</option>
        <option value="roblox">Roblox</option>
        <option value="fortnite">Fortnite</option>
        <option value="rainbowsixsiege">Rainbow Six Siege</option>
      </select>
    </div>

    <div id="product-container" class="product-grid">
      <!-- Products load here -->
    </div>
  </main>

  <!-- Snow container for falling snowflakes -->
  <div id="snow-container"></div>

  <script src="script.js"></script>
</body>
</html>
